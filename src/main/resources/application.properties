server.port=8080

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/contentcreator?createDatabaseIfNotExist=true&useSSL=false&connectionTimeZone=LOCAL
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (override via environment in production)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Frontend URL (for password reset links)
app.frontend-url=http://localhost:5173

# Social activity (Module 2) — set YOUTUBE_API_KEY env to enable live stats.
app.social.youtube.api-key=${YOUTUBE_API_KEY:}
app.social.instagram.access-token=${INSTAGRAM_ACCESS_TOKEN:}

# Email (SMTP) — configure via environment; empty username disables sending (OTP still logged).
spring.mail.host=${MAIL_HOST:smtp.elasticemail.com}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Content upload storage
app.upload.dir=./uploads

# Billing (Module 6 — Razorpay). Leave empty for mock checkout (semester demo safe).
# Set real test keys to enable live Razorpay orders + signature verification.
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.billing.free-thumbnail-per-week=3

# M3 thumbnail intelligence microservice (OpenCV, port 8001).
# Spring Boot orchestrates via ModuleOrchestratorService; Java heuristics are the fallback.
app.modules.connect-timeout-ms=2000
app.modules.read-timeout-ms=12000
app.modules.modules[0].name=thumbnail-scorer
app.modules.modules[0].base-url=${THUMBNAIL_SVC_URL:http://localhost:8001}
app.modules.modules[0].path=/analyze
app.modules.modules[0].health-path=/health
